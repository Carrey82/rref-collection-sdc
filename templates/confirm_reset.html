<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset demo · {{app}}</title>
<style>{{style}}</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <div class="in">
    <a class="brand" href="/"><span class="dot" aria-hidden="true"></span>{{app}} <small>{{team}}</small></a>
    <nav class="nav" aria-label="Main">{{nav}}</nav>
    <a class="reset" href="/reset">Reset demo</a>
  </div>
</header>

<main id="main" class="wrap">
  <div class="banner warn"><b>This wipes the demo state.</b><br>
    All approvals, drafts and audit entries will be deleted and the sample invoices restored.
    Use it right before recording your demo video, so the first screen is clean.</div>
  <div class="row2">
    <a class="btn" href="/reset?yes=1">Yes, reset everything</a>
    <a class="btn ghost" href="/">Cancel</a>
  </div>
</main>
<footer><span>{{app}} · {{team}}</span></footer>
</body>
</html>
